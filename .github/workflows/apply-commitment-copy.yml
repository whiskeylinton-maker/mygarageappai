name: One-shot DriveMetrik commitment copy patch
on:
  push:
    branches:
      - launch/drivemetrik-billing
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[skip-billing-copy]')"
    runs-on: ubuntu-latest
    steps:
      - name: Check out billing branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Patch commitment copy and check syntax
        run: node scripts/apply-commitment-copy.mjs
      - name: Commit copy and remove one-shot runner
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git rm .github/workflows/apply-commitment-copy.yml scripts/apply-commitment-copy.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html api/index.html
          git commit -m "Show plan commitment in subscription consent [skip-billing-copy]"
          git push origin "HEAD:${BRANCH_NAME}"
