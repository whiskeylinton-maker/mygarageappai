name: One-shot DriveMetrik billing patch
on:
  push:
    branches:
      - launch/drivemetrik-billing
permissions:
  contents: write
jobs:
  apply-patch:
    if: "!contains(github.event.head_commit.message, '[skip-billing-patch]')"
    runs-on: ubuntu-latest
    steps:
      - name: Check out billing branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply and syntax-check both app entry files
        run: node scripts/apply-drive-billing-patch.mjs
      - name: Commit changes and remove one-shot patch runner
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git rm .github/workflows/apply-drive-billing-patch.yml scripts/apply-drive-billing-patch.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html api/index.html
          git commit -m "Finalize server-verified DriveMetrik billing UI [skip-billing-patch]"
          git push origin "HEAD:${BRANCH_NAME}"
